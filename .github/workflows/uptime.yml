# Uptime and smoke check for www.glob-trek.com. Runs every 15 minutes; a failed
# run makes GitHub email the repository owner (Actions notifications are on by
# default). Checks only public pages and the health endpoint: no secrets.
name: Uptime

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Health endpoint
        run: |
          body=$(curl -fsS --max-time 20 https://www.glob-trek.com/api/health)
          echo "$body"
          echo "$body" | grep -q '"ok":true'
          ready=$(echo "$body" | sed -E 's/.*"destinationsReady":([0-9]+).*/\1/')
          test "$ready" -ge 20
      - name: Home page
        run: curl -fsS --max-time 20 -o /dev/null -w "%{http_code} %{time_total}s\n" https://www.glob-trek.com/
      - name: Results page
        run: curl -fsS --max-time 20 -o /dev/null -w "%{http_code} %{time_total}s\n" https://www.glob-trek.com/results
